const TABLONES_CONFIG = [
    { id: "tecnologia", label: "/Tecnologia/" },
    { id: "deporte", label: "/Deporte/" },
    { id: "random", label: "/Random/" },
    { id: "paranormal", label: "/Paranormal/" },
    { id: "sugerencias", label: "/Sugerencias/" },
    { id: "gastronomia", label: "/Gastronomia/" }
];

function cargarTablonesFijos() {
    const contenedor = document.getElementById('boardsList');
    if (!contenedor) return;
    
    contenedor.innerHTML = '';
    TABLONES_CONFIG.forEach((tablon, index) => {
        const a = document.createElement('a');
        a.href = `board.html?board=${tablon.id}`;
        a.className = 'board-link';
        a.textContent = tablon.label;
        contenedor.appendChild(a);

        if (index < TABLONES_CONFIG.length - 1) {
            const sep = document.createTextNode(' | ');
            contenedor.appendChild(sep);
        }
    });
}

async function purgarContenidoTablones() {
    try {
        const fechaDeCorte = new Date();
        fechaDeCorte.setDate(fechaDeCorte.getDate() - 3);

        await fetch(`${SB_URL}/rest/v1/publicaciones?fecha=lt.${fechaDeCorte.toISOString()}`, {
            method: 'DELETE',
            headers: { 
                'apikey': SB_KEY, 
                'Authorization': `Bearer ${SB_KEY}` 
            }
        });
    } catch (e) {
        console.warn("Error en la purga periódica:", e);
    }
}

function actualizarRelojIndex() {
    const timerElem = document.getElementById('cooldownTimer');
    if (!timerElem) return;

    const msCiclo = 3 * 24 * 60 * 60 * 1000;
    const ahora = Date.now();
    const tiempoFalta = msCiclo - (ahora % msCiclo);
    
    if (tiempoFalta <= 1000) {
        purgarContenidoTablones();
    }

    const d = Math.floor(tiempoFalta / 86400000);
    const h = Math.floor((tiempoFalta % 86400000) / 3600000);
    const m = Math.floor((tiempoFalta % 3600000) / 60000);
    const s = Math.floor((tiempoFalta % 60000) / 1000);
    
    timerElem.classList.remove('hidden');
    timerElem.textContent = `Limpieza en: ${d}d ${h}h ${m}m ${s}s`;
}

document.addEventListener('DOMContentLoaded', () => {
    cargarTablonesFijos();
    actualizarRelojIndex();
    setInterval(actualizarRelojIndex, 1000);

    if (donateBtn) {

});

<script>
  function setCryTheme(theme) {
    document.body.classList.remove('theme-rojo', 'theme-morado');
    if (theme !== 'default') {
      document.body.classList.add('theme-' + theme);
    }
    localStorage.setItem('crychan_theme', theme);
  }

  (function() {
    const savedTheme = localStorage.getItem('crychan_theme');
    if (savedTheme && savedTheme !== 'negro') {
      setCryTheme(savedTheme);
    } else {
      setCryTheme('default');
    }
  })();
</script>

<script>
let deferredPrompt = null;

// Escuchar evento de instalación
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
});

// Función de instalación al pulsar
async function triggerPWAInstall() {
    if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log('Resultado:', outcome);
        deferredPrompt = null;
    } else {
        alert("Para instalar CryChan en tu dispositivo:\n1. Pulsa los 3 puntos del navegador (arriba a la derecha).\n2. Elige 'Instalar aplicación' o 'Añadir a la pantalla de inicio'.");
    }
}
</script>
